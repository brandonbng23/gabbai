<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600;700&amp;display=swap">
        <title>
            {{title}}
        </title>
    </head>
    <body
        style="margin:0;padding:0;background-color:#f1f3f6;font-family:'Fustat',Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;">
        <div
            style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
            {{preheader}}
        </div>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
            style="background-color:#f1f3f6;">

            <tr>
                <td align="center" style="padding:32px 16px;">
                    <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr> <td><![endif]-->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                        style="width:100%;max-width:600px;table-layout:fixed;">
                        <tr>
                            <td style="padding:0;background-color:#111e2e;border-radius:14px 14px 0 0;">
                                <div style="padding:20px 28px;background-color:#111e2e;background-image:linear-gradient(115deg, #19344e, #111e2e 85%);border-radius:14px 14px 0 0;text-align:center;">
                                    <span style="color:#8bc8ff;font-family:'Fustat',Arial,Helvetica,sans-serif;font-weight:600;font-size:35px;line-height:1.3;">Gabbai</span>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td
                                style="padding:30px 28px 12px;background-color:#ffffff;border-left:1px solid #e3e5e9;border-right:1px solid #e3e5e9;">
                                <h1
                                    style="margin:0 0 22px;font-size:23px;line-height:1.35;font-weight:700;letter-spacing:-0.4px;color:#28272c;overflow-wrap:anywhere;">
                                    {{title}}
                                </h1>
                                {{content}}
                                <!-- IF_INBOX -->
                                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 22px;">
                                    <tr>
                                        <td bgcolor="#8bc8ff" style="border-radius:8px;text-align:center;">
                                            <a href="{{inboxUrl}}"
                                                style="display:inline-block;padding:13px 22px;border:1px solid #8bc8ff;border-radius:8px;color:#17344e;font-size:14px;line-height:20px;font-weight:700;text-decoration:none;mso-padding-alt:0;">
                                                <!--[if mso]><i style="mso-font-width:165%;mso-text-raise:20pt;" hidden>&emsp;</i><![endif]-->
                                                Open Gabbai
                                                <!--[if mso]><i style="mso-font-width:165%;" hidden>&emsp;&#8203;</i><![endif]-->
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                                <!-- END_IF_INBOX -->
                            </td>
                        </tr>
                        <tr>
                            <td
                                style="padding:20px 28px 24px;background-color:#fafbfc;border:1px solid #e3e5e9;border-top:1px solid #eceef1;border-radius:0 0 14px 14px;">
                                <p style="margin:0;font-size:12px;line-height:1.7;color:#74717d;">
                                    {{footer}}
                                </p>
                            </td>
                        </tr>
                        <tr>
                            <td align="center" style="padding:18px 12px 0;font-size:11px;line-height:1.6;color:#888591;">
                                Gabbai &middot; Copyright 2026
                            </td>
                        </tr>
                    </table>
                    <!--[if mso]></td> </tr></table><![endif]-->
                </td>
            </tr>
        </table>
    </body>
</html>
